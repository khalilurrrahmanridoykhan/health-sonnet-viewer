<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DHIS2 → FHIR Viewer</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 16px 24px; background: #1e293b; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header input { padding: 6px 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
  header button { padding: 6px 14px; border-radius: 4px; border: none; background: #2563eb; color: white; cursor: pointer; }
  header button:disabled { background: #475569; cursor: default; }
  #status { padding: 8px 24px; font-weight: bold; }
  .ok { color: #4ade80; }
  .fail { color: #f87171; }
  .skipped { color: #94a3b8; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #334155; }
  section { background: #0f172a; padding: 16px; overflow: auto; max-height: 75vh; }
  h2 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: #94a3b8; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  #warnings { padding: 0 24px 16px; color: #fbbf24; font-size: 13px; }
</style>
</head>
<body>

<header>
  <label>Program <input id="program" placeholder="IpHINAT79UW"></label>
  <label>Org Unit <input id="orgUnit" placeholder="DiszpKrYNg8"></label>
  <button id="fetchBtn">Fetch &amp; Convert</button>
</header>

<div id="status"></div>
<div id="warnings"></div>

<main>
  <section>
    <h2>DHIS2 source (live Tracker API)</h2>
    <pre id="dhis2Panel">Click "Fetch &amp; Convert" to load data.</pre>
  </section>
  <section>
    <h2>FHIR Bundle (DataSonnet + HAPI validated)</h2>
    <pre id="fhirPanel"></pre>
  </section>
</main>

<script>
const API_BASE = 'https://health-sonnet.onrender.com';

const fetchBtn = document.getElementById('fetchBtn');
const statusEl = document.getElementById('status');
const warningsEl = document.getElementById('warnings');
const dhis2Panel = document.getElementById('dhis2Panel');
const fhirPanel = document.getElementById('fhirPanel');

fetchBtn.addEventListener('click', async () => {
  const program = document.getElementById('program').value.trim();
  const orgUnit = document.getElementById('orgUnit').value.trim();

  const params = new URLSearchParams();
  if (program) params.set('program', program);
  if (orgUnit) params.set('orgUnit', orgUnit);

  fetchBtn.disabled = true;
  statusEl.textContent = 'Fetching from DHIS2... (first request may take ~50s if the backend was asleep)';
  statusEl.className = '';
  warningsEl.textContent = '';

  try {
    const response = await fetch(API_BASE + '/api/v1/dhis2/sync?' + params.toString());
    const body = await response.json();

    if (!response.ok && body.error) {
      statusEl.textContent = body.error + ': ' + body.message;
      statusEl.className = 'fail';
      dhis2Panel.textContent = '';
      fhirPanel.textContent = '';
      return;
    }

    dhis2Panel.textContent = JSON.stringify(body.dhis2Raw, null, 2);
    fhirPanel.textContent = JSON.stringify(body.bundle, null, 2);

    if (body.validationSkipped) {
      statusEl.textContent = 'FHIR validation: SKIPPED (disabled on this host to save memory)';
      statusEl.className = 'skipped';
    } else {
      const valid = body.validation && body.validation.successful;
      statusEl.textContent = 'FHIR validation: ' + (valid ? 'SUCCESS' : 'FAILED');
      statusEl.className = valid ? 'ok' : 'fail';
    }

    if (body.warnings && body.warnings.length) {
      warningsEl.textContent = 'Warnings: ' + body.warnings.join(' | ');
    }
  } catch (error) {
    statusEl.textContent = 'Request failed: ' + error.message;
    statusEl.className = 'fail';
  } finally {
    fetchBtn.disabled = false;
  }
});
</script>
</body>
</html>
